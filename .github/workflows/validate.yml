name: Validate
on:
  push:
  pull_request:
jobs:
  shell-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck lau scripts/*.sh lib/*.sh
      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/^ADMIN_TOKEN=.*/ADMIN_TOKEN=test-token/' .env
          cat > compose.override.yaml <<'YAML'
          services:
            vaultwarden:
              ports:
                - "127.0.0.1:8080:80"
          YAML
      - name: Validate Compose
        run: docker compose --env-file .env -f compose.yaml -f compose.override.yaml config
