name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Bash syntax
        run: bash -n install.sh lau scripts/*.sh lib/*.sh tests/*.sh
      - name: ShellCheck
        run: shellcheck -x -e SC1091 install.sh lau scripts/*.sh lib/*.sh tests/*.sh
      - name: CLI smoke test
        run: bash tests/test-cli.sh

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: cp .env.example .env
      - name: Validate Compose
        run: docker compose --env-file .env -f compose.yaml config

